name: Tests
on: [push, pull_request]
jobs:
  api:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ['3.11', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: '0.10.9'
      - run: uv sync --locked --python ${{ matrix.python }}
      - run: uv run --no-sync python -m pytest -q
      - run: bash -n deploy/deploy.sh deploy/litegame-server
