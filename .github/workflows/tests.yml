name: Tests
on: [push, pull_request]
jobs:
  api:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ['3.11', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -r requirements.lock pytest httpx
      - run: python -m pytest -q
      - run: bash -n deploy/deploy.sh deploy/litegame-server
