# HTTP-only API server. Replace save.example.com with your actual API domain.
# Include inside nginx's http {} context (e.g. /etc/nginx/conf.d/litegame-api.conf).
# Temporary setup only: HTTP does not encrypt passwords or bearer tokens.
server {
    listen 80;
    server_name save.example.com;
    server_tokens off;

    # Match the API's default 16 MiB request limit, including NES snapshots.
    client_max_body_size 16m;
    client_header_timeout 10s;
    client_body_timeout 15s;
    keepalive_timeout 20s;
    send_timeout 30s;

    add_header X-Content-Type-Options nosniff always;

    location / {
        proxy_pass http://127.0.0.1:9494;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_send_timeout 30s;
        proxy_read_timeout 30s;
        proxy_cache off;
    }
}
