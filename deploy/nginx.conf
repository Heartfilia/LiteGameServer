# Standalone API subdomain template. Replace save.example.com and certificate paths.
# Put this file inside nginx's http {} context (e.g. /etc/nginx/conf.d/...).
limit_req_zone $binary_remote_addr zone=litegame_api:10m rate=10r/s;
limit_req_zone $binary_remote_addr zone=litegame_login:10m rate=5r/m;

server {
    listen 80;
    server_name save.example.com;
    location / { return 301 https://$host$request_uri; }
    # Configure your ACME challenge location separately if using webroot renewal.
}

server {
    listen 443 ssl;
    server_name save.example.com;
    server_tokens off;
    ssl_certificate /etc/letsencrypt/live/save.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/save.example.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    client_max_body_size 16m;
    client_body_timeout 15s;
    keepalive_timeout 20s;
    add_header X-Content-Type-Options nosniff always;

    location = /api/v1/auth/login {
        limit_req zone=litegame_login burst=10 nodelay;
        limit_req_status 429;
        proxy_pass http://127.0.0.1:9494;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_read_timeout 30s;
    }

    location / {
        limit_req zone=litegame_api burst=30 nodelay;
        limit_req_status 429;
        proxy_pass http://127.0.0.1:9494;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_read_timeout 30s;
    }
}
